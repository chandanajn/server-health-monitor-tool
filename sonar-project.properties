# SonarCloud configuration for Server Health Monitor API

# Project identification
sonar.organization=chandanajn
sonar.projectKey=chandanajn_server-health-monitor-tool
sonar.projectName=server-health-monitor-tool

# Source and test paths
sonar.sources=src
sonar.tests=tests

# Target runtime environment
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Code coverage report path (generated by pytest-cov with relative_files=true)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions justification:
# - org/**: Contains sample mock server log files used for verification and demonstration.
#   These are data files rather than executable application logic.
# - scripts/**: Contains standalone container smoke test utilities used during build verification.
sonar.exclusions=org/**,scripts/**
