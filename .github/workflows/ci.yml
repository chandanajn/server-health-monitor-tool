name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: 1. Setup, Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run Ruff linter
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Strict type checking with MyPy
        run: mypy src tests scripts

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  test:
    name: 2. Unit Tests & Coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run pytest with coverage gate (>= 80%)
        run: |
          pytest --cov=health_api \
                 --cov-report=xml \
                 --cov-report=term-missing \
                 --cov-fail-under=80

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 1

  sonar:
    name: 3. SonarCloud Quality Gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full git history for blame analysis)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Verify SonarCloud credentials
        id: check-sonar
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "Fork pull request detected. Secrets are unavailable on fork PRs; skipping SonarCloud analysis."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "::error ::SONAR_TOKEN secret is not configured in repository settings. SonarCloud quality gate is mandatory on non-fork runs."
            exit 1
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run SonarCloud Scan & Enforce Quality Gate
        if: steps.check-sonar.outputs.skip != 'true'
        uses: sonarsource/sonarcloud-github-action@v3
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            ${{ vars.SONAR_PROJECT_KEY && format('-Dsonar.projectKey={0}', vars.SONAR_PROJECT_KEY) || '' }}
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: 4. Build Container Image
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --tag "health-api:${{ github.sha }}" \
            --build-arg VCS_REF="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --build-arg VERSION="0.1.0" \
            .

      - name: Save Docker image archive
        run: docker save "health-api:${{ github.sha }}" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  smoke:
    name: 5. Container Smoke Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image into daemon
        run: docker load -i image.tar

      - name: Run container smoke tests
        run: python scripts/smoke_test.py "health-api:${{ github.sha }}"

  scan:
    name: 6. Container Vulnerability Scan (Trivy)
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image into daemon
        run: docker load -i image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "health-api:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          trivyignores: ".trivyignore"
          output: "trivy-report.txt"

      - name: Display Trivy scan findings
        if: always()
        run: |
          if [ -f trivy-report.txt ]; then
            cat trivy-report.txt
          fi

      - name: Upload Trivy scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore
          retention-days: 1
